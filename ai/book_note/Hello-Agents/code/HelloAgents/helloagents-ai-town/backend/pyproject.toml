[project]
name = "helloagents-ai-town-backend"
version = "0.1.0"
description = "Chapter 15.1 Cyber Town architecture baseline"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "python-dotenv>=1,<2",
    "uvicorn[standard]>=0.32,<1",
]

[build-system]
requires = ["setuptools>=73", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["architecture", "config", "main", "models"]

[tool.ruff]
line-length = 88
target-version = "py310"
