[project]
name = "helloagents-ai-town-backend"
version = "0.3.0"
description = "Chapter 15.1-15.3 Cyber Town NPC and affinity practice"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "openai>=1.55,<3",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "python-dotenv>=1,<2",
    "uvicorn[standard]>=0.32,<1",
]

[build-system]
requires = ["setuptools>=73", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "agents",
    "architecture",
    "batch_generator",
    "config",
    "main",
    "models",
    "relationship_manager",
]

[tool.ruff]
line-length = 88
target-version = "py310"
