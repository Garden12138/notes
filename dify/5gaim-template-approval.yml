    - data:
        code: "import json\nimport re\nfrom zhdate import ZhDate as lunar_date\n\n\
          def main(arg1: str, year: str) -> dict:\n    # 参数arg1为模型提取的日期，可能出现格式不对，对于格式不正确的日期进行下面逻辑处理会发生异常，暂时先补货异常，返回{\"\
          result\": \"\"}\n    try:\n      s1 = arg1.replace('\\n', '').replace('\\\
          r', '').replace('json', '').replace('```', '')\n      js = json.loads(s1)\n\
          \      rs = js['result']\n      # 图中没有提取到日期\n      if rs == '': \n     \
          \     return {\n            \"result\": \"\",\n          }\n      else:\n\
          \          lu = js['lunar']\n          # 图中提取到的是新历日期，直接返回\n          if\
          \ lu == '0':\n            return {\n              \"result\": js['result']\n\
          \            }\n          # 图中提取到的是农历日期，转换为新历日期返回\n          else:\n   \
          \         match = re.search(r'农历(\\d+)月(\\d+)日', js['result'])\n       \
          \     month = match.group(1)\n            day = match.group(2)\n       \
          \     lda = lunar_date(int(year), int(month), int(day))\n            return\
          \ {\n              \"result\": lda.to_datetime().strftime('%Y-%m-%d')\n\
          \            }\n    except:\n      return {\n        \"result\": \"\"\n\
          \      }        \n\n\n\n     \n"
        code_language: python3
