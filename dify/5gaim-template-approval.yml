        - id: 5b1f6c90-0234-4a15-80cd-97a12fb26d5e
          role: system
          text: 你是一个图文内容提取专家，首先你会识别图片里出现的常见广告推广中所使用的节日简称活动内容，然后你会根据今年已有的日历，输出活动内容所代表的日期。
        - id: 880840e6-b07b-446d-9066-67827df138ea
          role: user
          text: '分析图片中的内容，提取广告推广中所使用的节日简称活动内容，根据今年已有的日历，输出活动内容所代表的日期。其中常见的新历活动内容示例：

            1、情人节 ：“情人节特惠”、“情人节献礼”；

            2、妇女节 ：“三八节活动”、“女神节优惠”；

            3、清明节： “清明踏青季”、“清明出行特惠”；

            4、劳动节：“五一特惠”、“五一黄金周”；

            5、母亲节：“母亲节感恩回馈”、“妈妈专属优惠”；

            6、父亲节：“父亲节献礼”、“老爸专属优惠”；

            7、教师节：“教师节感恩”、“老师专属优惠”；

            8、国庆节：“国庆大促”、“十一黄金周”；

            9、双十一：“双11狂欢”、“双十一购物节”；

            10、圣诞节：“圣诞狂欢”、“圣诞特惠”；

            11、新年：“跨年狂欢”、“元旦特惠”；

            常见的农历活动内容示例：

            1、春节：“新春特惠”、“迎春大促”，农历1月1日；

            2、端午节：“端午粽香”、“端午特惠”，农历5月5日；

            3、七夕节：“七夕鹊桥相会”、“七夕甜蜜特惠”，农历7月7日；

            4、中秋节：“中秋团圆”、“中秋月饼礼盒”，农历8月15日；

            若没有提取到日期，请以json格式输出，如：{"result": ""}；若提取的内容属于新历活动内容，则以json格式输出，如：{"result":
            "yyyy-MM-dd", "lunar": "0"}，其中"yyyy"代表{{#1730966510605.result#}}、"MM"代表月份和"dd"代表日期；若提取的内容属于农历活动内容，以json格式输出，如：{"result":
            "农历1月1日", "lunar": "1"}，其中"result"字段填充输出农历日。'
