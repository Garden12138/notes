    - data:
        code: "import json\nimport time\n\ndef main(arg1: str, arg2: str) -> dict:\n\
          \    # 流程1推断的结果可能存在参数不正确，进行json序列化时会发生异常，此时直接返回通过\n    try: \n      s1 =\
          \ arg1.replace('\\n', '').replace('\\r', '').replace('json', '').replace('```',\
          \ '')\n      j1 = json.loads(s1)\n      r1 = j1['result']\n    except:\n\
          \        dic = {\"result\": \"1\", \"auditTime\": time.strftime(\"%Y-%m-%d\
          \ %H:%M:%S\", time.localtime())}\n        return {\n            \"result\"\
          : json.dumps(dic, ensure_ascii=False)\n        }\n    # 流程1、2都通过\n    if\
          \ r1 == '1' and arg2 == '1':\n        dic = {\"result\": \"1\", \"auditTime\"\
          : time.strftime(\"%Y-%m-%d %H:%M:%S\", time.localtime())}\n        return\
          \ {\n            \"result\": json.dumps(dic, ensure_ascii=False)\n     \
          \   }\n    # 流程1不通过、流程2通过\n    elif r1 == '0' and arg2 == '1':\n       \
          \ dic = {\"result\": \"0\", \"reason\": j1['reason'], \"auditTime\": time.strftime(\"\
          %Y-%m-%d %H:%M:%S\", time.localtime())}\n        return {\n            \"\
          result\": json.dumps(dic, ensure_ascii=False)\n        }\n    # 流程1通过、流程2不通过\n\
          \    elif r1 == '1' and arg2 == '0':\n        dic = {\"result\": \"0\",\
          \ \"reason\": \"活动日期失效。\", \"auditTime\": time.strftime(\"%Y-%m-%d %H:%M:%S\"\
          , time.localtime())}\n        return {\n            \"result\": json.dumps(dic,\
          \ ensure_ascii=False)\n        }\n    # 流程1、2不通过\n    else:\n        rs\
          \ = j1['reason'] + \"以及\" + \"活动日期失效。\";\n        dic = {\"result\": \"\
          0\", \"reason\": rs, \"auditTime\": time.strftime(\"%Y-%m-%d %H:%M:%S\"\
          , time.localtime())}\n        return {\n            \"result\": json.dumps(dic,\
          \ ensure_ascii=False)\n        }\n\n"
