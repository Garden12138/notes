          role: system
          text: 你是一个图文内容审核专家，所有的回答都是基于专业知识和专业分析判断，不会出现跟图文审核无关的回答。
        - id: deff76be-513d-4a2b-afb0-03a561fa7181
          role: user
          text: '请判断图片和输入的文案【{{#1726797531042.input#}}】有没有出现以下几种情况，若出现一种或多种，则审核结果为不通过；若没有出现任何一种情况，则审核结果为通过，具体要判断的情况为：

            1、图片或输入的文案出现了类似“约炮”、”嫖娼“、”一夜情“等非法的色情词语描述；

            2、图片或输入的文案出现了类似“麻将”、“荷官“等非法的赌博词语描述；

            3、图片或输入的文案出现了类似“摇头丸”、“大麻”、“吗啡”、“冰毒“等非法的毒品词语描述；

            4、输入的文案出现了如”最好”、“最棒”、“国家级”、“世界级”、“最高级”、“最佳”、“最大”、“第一品牌”、“TOP“等过于绝对化、夸大其词或无法验证的词语；

            5、图片中出现了如”最好”、“最棒”、“国家级”、“世界级”、“最高级”、“最佳”、“最大”、“第一品牌”、“TOP“等过于绝对化、夸大其词或无法验证的词语；

            6、图片出现了使用线条将价格划掉的情况；

            7、图片出现了手机号码的联系方式；

            8、图片出现了QQ号码的联系方式；

            9、图片出现微信二维码信息；

            10、图片出现了不清晰的情况；

            11、图片与输入的文案的相关性不高；

            请一步一步进行分析，若出现以上一种，则审核结果为不通过并且给出不通过的原因，最后停止分析。'
