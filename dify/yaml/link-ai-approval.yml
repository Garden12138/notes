    - data:
        code: "from urllib.parse import urlparse\n\n# ===== 黑名单配置 =====\n# 精确域名黑名单\n\
          DENY_EXACT = {\n    \"bad.com\",\n    \"evil.example\",\n    \"www.baidu.com\"\
          \n}\n\n# 主域名黑名单（命中该域名及其所有子域名）\nDENY_BASE = {\n    \"phish.com\",\n    \"\
          malware.site\",\n}\n\n\ndef normalize_url(url: str) -> str:\n    \"\"\"\n\
          \    URL 规范化：\n    - 如果没有 scheme（如 https://），自动补 https://\n    \"\"\"\n\
          \    url = url.strip()\n    if not url:\n        return url\n\n    parsed\
          \ = urlparse(url)\n    if not parsed.scheme:\n        url = \"https://\"\
          \ + url\n\n    return url\n\n\ndef check_blacklist_only(url: str) -> str:\n\
          \    \"\"\"\n    仅做黑名单校验\n    - 命中黑名单：返回原因\n    - 未命中：返回“检测通过”\n    - URL\
          \ 不符合预期结构：返回明确错误\n    \"\"\"\n    # \U0001F511 先做 URL 规范化\n    url = normalize_url(url)\n\
          \n    parsed = urlparse(url)\n    hostname = parsed.hostname\n    if not\
          \ hostname:\n        return \"URL 缺少主机名，无法进行黑名单校验\"\n\n    # IDN → punycode\
          \ + 统一小写\n    host = hostname.encode(\"idna\").decode(\"ascii\").lower().strip(\"\
          .\")\n\n    # 精确命中\n    if host in DENY_EXACT:\n        return f\"域名命中黑名单：{host}\"\
          \n\n    # 主域 / 子域命中\n    for base in DENY_BASE:\n        base = base.lower().strip(\"\
          .\")\n        if host == base or host.endswith(\".\" + base):\n        \
          \    return f\"域名命中黑名单：{host}\"\n\n    return \"检测通过\"\n\n\ndef main(arg1:\
          \ str):\n    return {\n        \"result\": check_blacklist_only(arg1),\n\
          \    }\n"
