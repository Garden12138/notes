            \n首先，请查看区域1的图片内容：\n【{{#1769416137767.G1_picture.output#}}】\n\n接下来，请查看区域1的图片链接内容：\n\
            【{{#1769416137767.G1_link#}}】\n\n接下来，请查看区域2的标题文案：\n【{{#1769416137767.G2_content.output#}}】\n\
            \n接下来，请查看区域3的正文文案：\n【{{#1769416137767.G3_content.output#}}】\n\n接下来，请查看区域4的按钮文案：\n\
