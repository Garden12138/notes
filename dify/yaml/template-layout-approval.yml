    - data:
        code: "import json\nfrom typing import Any, Dict\n\n\ndef _safe_json_loads(s:\
          \ str) -> Any:\n    \"\"\"尽量把字符串解析成 JSON；失败就返回 None。\"\"\"\n    try:\n \
          \       return json.loads(s)\n    except Exception:\n        return None\n\
          \n\ndef _get_q1_picture(data: Any) -> str:\n    \"\"\"从 dict 结构中安全取出 q1.picture，不存在则返回空字符串。\"\
          \"\"\n    if not isinstance(data, dict):\n        return \"\"\n    q1 =\
          \ data.get(\"q1\")\n    if not isinstance(q1, dict):\n        return \"\"\
          \n    pic = q1.get(\"picture\")\n    return pic if isinstance(pic, str)\
          \ else \"\"\n\n\ndef main(arg1: str):\n    # 1) 先尝试把 arg1 当 JSON 字符串解析\n\
          \    parsed = _safe_json_loads(arg1) if isinstance(arg1, str) else None\n\
          \n    # 2) 如果解析失败，但 arg1 恰好是 dict（某些框架会传进来），也支持\n    if parsed is None and\
          \ isinstance(arg1, dict):  # type: ignore[unreachable]\n        parsed =\
          \ arg1\n\n    picture = _get_q1_picture(parsed)\n\n    return {\n      \
          \  \"result\": picture,\n    }\n"
