        desc: ''
        instruction: "## 任务\n从JSON数据中提取出不同的数据参数，用于生成echarts图表\n\n## 要求\n1. 根据数据，起一个标题，并赋值给title\n\
          2. 根据数据以及用户问题，选择合适的图表：line、bar、pie，三选一，将选择结果赋值给chartType\n用户问题：\n```\n{{#sys.query#}}\n\
          ``` \n3.  根据数据，判断要只做的echarts图表类型，提取y轴的数据赋值给ydata，每个文本用单引号引起之间用 \";\" 分隔\n\
          4. 把x轴的数据赋值给xdate，每个文本用单引号引起之间用 \";\" 分隔\n5. 如果数据超过4份，则只提取4份数据\n\n## 示例\n\
          给定的JSON数据：\n​```\n{\n\"text\": \"销售日期      |日销售总额   \\n----------|--------\\\
          n2021-05-01|18819.99\\n2021-05-02|3292.00 \\n2021-05-04|37564.94\\n2021-05-05|3607.01\"\
          ,\n\"files\": [],\n\"json\": []\n}\n​```\n\n抽取的结果：\n​```\ntitle: 2021年5月1每日销售\n\
          chartType: bar\nydata: 18819.99;3292;37564.939999999995;3607.01\nxdata:\
          \  2021-05-01;2021-05-02;2021-05-04;2021-05-05\n​```\n"
